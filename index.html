<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog App - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #333; color: white;">
      <h2 style="margin: 0;">My Blog App</h2>
      <ul style="list-style: none; display: flex; gap: 15px; margin: 0; padding: 0;">
        <li><a href="index.html" style="color: white; text-decoration: none; font-weight: bold;">Home</a></li>
        <li><a href="add-blog.html" style="color: white; text-decoration: none;">Add Blog</a></li>
      </ul>
    </nav>
  </header>
  <hr>
  <main style="padding: 20px;">
    <h1>All Blog Posts</h1>
    <div id="blogList"></div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const blogList = document.getElementById("blogList");
      const blogs = JSON.parse(localStorage.getItem("blogs")) || [];

      if (blogs.length === 0) {
        blogList.innerHTML = "<p>No blogs found. Click 'Add Blog' to create one!</p>";
        return;
      }

      blogList.innerHTML = blogs.map((blog, index) => `
        <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px;">
          <h3>${blog.title}</h3>
          <p>${blog.content}</p>
          <small>Author: ${blog.author || 'Anonymous'}</small><br><br>
          <a href="edit-blog.html?id=${index}" style="background-color: #007bff; color: white; padding: 6px 12px; text-decoration: none; border-radius: 3px; font-size: 14px; margin-right: 10px;">Edit</a>
          <button onclick="deleteBlog(${index})" style="background-color: red; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Delete</button>
        </div>
      `).join("");
    });

    function deleteBlog(index) {
      let blogs = JSON.parse(localStorage.getItem("blogs")) || [];
      blogs.splice(index, 1);
      localStorage.setItem("blogs", JSON.stringify(blogs));
      location.reload();
    }
  </script>
</body>
</html>
