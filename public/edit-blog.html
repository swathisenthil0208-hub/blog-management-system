<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h2>My Blog App</h2>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/add-blog">Add Blog</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Edit Blog Post</h1>
        <form id="editForm" method="POST">
            <div style="margin-bottom: 15px;">
                <label for="title" style="font-weight: 600;">Blog Title:</label><br>
                <input type="text" id="title" name="title" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="content" style="font-weight: 600;">Blog Content:</label><br>
                <textarea id="content" name="content" rows="6" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px;"></textarea>
            </div>
            <button type="submit" style="padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Update Blog</button>
        </form>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('id');

        if (blogId) {
            const editForm = document.getElementById('editForm');
            editForm.action = `/api/blogs/update/${blogId}`;

            fetch(`/api/blogs/${blogId}`)
                .then(res => res.json())
                .then(blog => {
                    document.getElementById('title').value = blog.title;
                    document.getElementById('content').value = blog.content;
                })
                .catch(err => console.error('Error fetching blog:', err));
        }
    </script>
</body>
</html>
