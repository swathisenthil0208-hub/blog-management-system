<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Add Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h2>My Blog App</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add-blog.html">Add Blog</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <h1>Create a New Blog Post</h1>
        <div id="message"></div>
        <form id="blogForm" action ="/api/blogs" method="POST">
            <div>
                <label for="title">Blog Title:</label><br>
                <input type="text" id="title" name="title" placeholder="Enter title" required>
            </div>
            <br>
            <div>
                <label for="content">Blog Content:</label><br>
                <textarea id="content" name="content" rows="5" placeholder="Write your content here..." required></textarea>
            </div>
            <br>
            <button type="submit">Publish Blog</button>
        </form>
    </main>
    <hr>
    <footer>
        <p>&copy; 2026 My Blog Management System. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
